# Registry of every recurring CI/Vercel cost across the portfolio: GitHub
# Actions `schedule:` crons and Vercel `crons:` entries. scripts/check-workflow-
# policy.mjs fails a PR that adds a schedule or vercel.json cron not listed
# here — a cron becomes something you register with a reason, not something
# that silently starts billing.
#
# Baseline captured 2026-08-16 from the portfolio CI/Vercel audit. Add a new
# entry in the same PR that adds the cron, with a one-line reason.

repos:
  Doman-Digital:
    github_actions_crons:
      - workflow: stale.yml
        cron: "30 1 * * *"
        reason: "daily stale issue/PR sweep, no checkout, near-zero cost"
      - workflow: ci.yml
        cron: "43 4 * * 1"
        reason: "weekly comprehensive full-suite sweep — deliberate, catches regressions on repos that haven't shipped in a week; paths-filter is intentionally bypassed on this trigger"
      - workflow: coverage-audit.yml
        cron: "17 4 * * 2"
        reason: "weekly content coverage crawl of production, 15min cap, now Tuesday"
      - workflow: review-calibration-weekly.yml
        cron: "23 5 * * 3"
        owner: "Doman Digital / Marketing Site"
        reason: "weekly live review calibration against independent referees, 120min cap, now Wednesday"
      - workflow: client-stack-weekly.yml
        cron: "37 4 * * 4"
        owner: "Doman Digital / Marketing Site"
        reason: "weekly live browser capture of client sites for stack drift, 90min cap, now Thursday"
      - workflow: client-screenshots-weekly.yml
        cron: "47 4 * * 5"
        owner: "Doman Digital / Marketing Site"
        reason: "weekly live re-capture of the client screenshots, 90min cap, now Friday"
      - workflow: company-os.yml
        cron: "15 7 * * 1"
        owner: "Doman Digital / Company OS"
        reason: "weekly Company OS scorecard and canonical mirror refresh (DOM-377), 8min cap"
      - workflow: security-rotation-reminder.yml
        cron: "13 9 1 1,4,7,10 *"
        reason: "quarterly secret-rotation-due check, 5min cap, off the hour"
      - workflow: stripe-prices.yml
        cron: "41 6 * * *"
        owner: "Doman Digital / Marketing Site"
        reason: "daily live check that every Stripe Price the site sells matches brand-facts (DOM-1059), no install, 5min cap on the light pool"
      - workflow: dd-site-drift.yml
        cron: "7,27,47 * * * *"
        owner: "Doman Digital / Marketing Site"
        reason: "every 20 minutes: red when the live site lags main (DOM-1490); one checkout and one curl, no install, 5min cap on the light pool, off the hour"
      # DOM-847 (Doman-Digital #1159): the first three days of the quarter, so a
      # dropped run is caught; the entry above goes when #1159 merges.
      - workflow: security-rotation-reminder.yml
        cron: "13 9 1-3 1,4,7,10 *"
        reason: "quarterly secret-rotation-due check on days 1-3, skips when a reminder is already open, 5min cap, off the hour"
    vercel_crons:
      - app: apps/marketing
        path: /api/cron/churn-followup
        schedule: "0 9 * * *"
        reason: "daily churn-followup dispatch"
      - app: apps/portal
        path: /api/internal/demo-followup/dispatch
        schedule: "30 9 * * *"
        reason: "daily demo-followup dispatch"
      - app: apps/portal
        path: /api/internal/google-ads/upload-conversions
        schedule: "15 2 * * *"
        reason: "nightly sweep for conversion dispatches claimed but never confirmed — without it a lead's outcome silently never reaches Google"

  dd-claude-kit:
    # repo-metadata.yml was removed on 2026-10-03; the estate sweep in
    # dd-repo-registry replaced it.
    github_actions_crons: []
    vercel_crons: []

  dd-repo-registry:
    github_actions_crons:
      - workflow: sweep.yml
        cron: "15 6 * * *"
        owner: "DD Framework"
        reason: "daily estate sweep: every repo the GitHub App can see, against the register; API reads only, about a minute, 10min cap. Also the estate's secret scan of each default branch's last 26 hours (DOM-776)"
      - workflow: sweep.yml
        cron: "17 3 * * 6"
        owner: "DD Framework"
        reason: "weekly secret scan of all history in every repo the GitHub App can see: the one full-history scan, replacing each repo's own (DOM-776 step 5), 60min cap"
      - workflow: repo-settings.yml
        cron: "40 6 * * *"
        owner: "DD Framework"
        reason: "daily apply of repo-settings.yaml (update-branch, auto-merge, the dd-baseline ruleset) to every repo the GitHub App can see, so new repos are covered and drift is put back and posted to ops (DOM-1037); API calls only, about two minutes, 20min cap"
      - workflow: lighthouse-live.yml
        cron: "17 6 * * 1"
        owner: "DD Framework"
        reason: "weekly Lighthouse of every live page the registry lists under lighthouse.paths, through the PageSpeed Insights API (Google's hardware, no browser here), median of 3 runs, about ten minutes, 45min cap; replaces client-previews site-health.yml (DOM-776)"
    vercel_crons: []

  dd-relay:
    github_actions_crons:
      - workflow: ops-canary.yml
        cron: "20 5 * * *"
        owner: "Doman Digital / Ops"
        reason: "the ops Worker's github-feed canary: one step that fails on purpose daily so the cockpit proves it still sees red scheduled workflows (DOM-1029); light runner, 2min cap"
      - workflow: ops-contract.yml
        cron: "40 9 * * *"
        owner: "Doman Digital / Ops"
        reason: "nightly ops contract check: the cockpit's counts against direct Linear, GitHub, jobs.yaml and alert queries, and every feed's canary (DOM-1029); API reads and one SELECT, 10min cap"
    vercel_crons: []

  meridian:
    github_actions_crons:
      - workflow: nightly-live-modules.yml
        cron: "17 3 * * *"
        owner: "Meridian"
        reason: "nightly module integration harness against live third-party sites, moved off every pull request where it took a VM on each push and nobody acted on the result (DOM-1444, CI-017); one Rust build and test, 15min cap, non-blocking"
    vercel_crons: []

  dd-ci-standards:
    github_actions_crons:
      - workflow: renovate.yml
        cron: "17 4 * * *"
        owner: "DD Framework"
        reason: "daily self-hosted Renovate across the portfolio, so house packages (@domandigital/*) land within a day; other updates still wait for Monday (DOM-1043). Public repo, so hosted minutes are free. Unregistered until 2026-10-03: the old cron check read only the first cron line and missed it"
    vercel_crons: []

  chair-and-blade:
    github_actions_crons: []
    vercel_crons:
      - app: root
        path: /api/cron/revalidate-reviews
        schedule: "0 3 * * *"
        reason: "daily Google review revalidation"

  Tardi-Group:
    github_actions_crons: []
    vercel_crons:
      - app: root
        path: /api/cron/nurture
        schedule: "0 9 * * *"
        reason: "daily lead nurture sequence"
      - app: root
        path: /api/cron/gdpr-retention
        schedule: "0 3 * * *"
        reason: "daily GDPR data retention sweep"

  sen-sphere:
    github_actions_crons:
      - workflow: scheduled-sweeps.yml
        cron: "17 7 * * 1"
        reason: "weekly drift sweeps for things no commit triggers: CMS copy, GA4 collection, legal page dates"
    vercel_crons:
      - app: apps/portal
        path: /api/portal/cron/retention
        schedule: "0 6 * * *"
        reason: "daily data retention run in the portal"
      - app: apps/portal
        path: /api/portal/cron/notifications
        schedule: "0 7 * * *"
        reason: "daily portal notification dispatch"
      - app: apps/portal
        path: /api/portal/cron/marketing-audience
        schedule: "0 8 * * *"
        reason: "daily marketing audience sync from the portal"

  RMP-Electrical:
    github_actions_crons:
      - workflow: deploy-astro.yml
        cron: "17 3 * * *"
        reason: "daily rebuild of the Astro site so Google reviews and the footer year stay current"
    vercel_crons: []

  Rise-and-bloom:
    github_actions_crons: []
    vercel_crons:
      - app: root
        path: /api/cron/lulu-unpaid
        schedule: "0 8 * * *"
        reason: "daily check for print orders left unpaid at Lulu; emails the team when one is waiting, since an unpaid order is never printed"

  MMM-Beauty:
    github_actions_crons: []
    # 23 Vercel crons registered on apps/portal as of 2026-08-16, ~2,180
    # invocations/day, dominated by process-jobs running every minute
    # (1,440/day alone). Flagged in the audit as a Phase 4 follow-up —
    # process-jobs is a strong candidate to move to QStash event-driven
    # dispatch instead of a minute poll. Registering the full baseline here
    # so the policy check doesn't fire on pre-existing crons; do not add to
    # this list without a reason, and treat this repo's cron count itself
    # as the thing to bring down, not just keep steady.
    vercel_crons:
      - app: apps/portal
        path: /api/cron/process-jobs
        schedule: "* * * * *"
        reason: "job queue poll — candidate for QStash event-driven replacement, see Phase 4"
      - app: apps/portal
        path: /api/cron/sync-gmail
        schedule: "*/5 * * * *"
        reason: "inbox sync"
      - app: apps/portal
        path: /api/cron/warm-revenue-cache
        schedule: "*/8 * * * *"
        reason: "revenue dashboard cache warm"
      - app: apps/portal
        path: /api/cron/expire-slot-holds
        schedule: "*/15 * * * *"
        reason: "booking slot hold expiry"
      - app: apps/portal
        path: /api/cron/sync-receipts
        schedule: "*/20 * * * *"
        reason: "receipt sync"
      - app: apps/portal
        path: /api/cron/reconcile-gift-cards
        schedule: "*/30 * * * *"
        reason: "gift card reconciliation"
      - app: apps/portal
        path: /api/cron/reconcile-orphan-bookings
        schedule: "0 * * * *"
        reason: "hourly orphan booking reconciliation"
      - app: apps/portal
        path: /api/cron/reconcile-square-bookings
        schedule: "15 */2 * * *"
        reason: "Square booking reconciliation"
      - app: apps/portal
        path: /api/cron/recovery
        schedule: "0 */4 * * *"
        reason: "recovery sweep"
      - app: apps/portal
        path: /api/cron/data-retention
        schedule: "30 2 * * *"
        reason: "daily data retention sweep"
      - app: apps/portal
        path: /api/cron/reconcile-payments
        schedule: "0 3 * * *"
        reason: "daily payment reconciliation"
      - app: apps/portal
        path: /api/cron/lifecycle-emitter
        schedule: "30 3 * * *"
        reason: "lifecycle event emission"
      - app: apps/portal
        path: /api/cron/sync-square-sanity
        schedule: "0 4 * * *"
        reason: "Square-to-Sanity sync"
      - app: apps/portal
        path: /api/cron/sync-instagram-gallery
        schedule: "15 4 * * *"
        reason: "Instagram gallery sync"
      - app: apps/portal
        path: /api/cron/sync-freeagent-tax
        schedule: "0 5 * * *"
        reason: "FreeAgent tax sync"
      - app: apps/portal
        path: /api/cron/sync-reviews
        schedule: "0 5 * * *"
        reason: "review sync"
      - app: apps/portal
        path: /api/cron/sync-personal-finance
        schedule: "10 5 * * *"
        reason: "personal finance sync"
      - app: apps/portal
        path: /api/cron/detect-recurring-bills
        schedule: "35 5 * * *"
        reason: "recurring bill detection"
      - app: apps/portal
        path: /api/cron/reconcile-unit-costs
        schedule: "50 5 * * *"
        reason: "unit cost reconciliation"
      - app: apps/portal
        path: /api/cron/sync-marketing-analytics
        schedule: "0 6 * * *"
        reason: "marketing analytics sync"
      - app: apps/portal
        path: /api/cron/lumi-outreach-digest
        schedule: "0 7 * * *"
        reason: "outreach digest"
      - app: apps/portal
        path: /api/cron/finance-digest
        schedule: "0 8 * * *"
        reason: "finance digest"
      - app: apps/portal
        path: /api/cron/consultation-form-chaser
        schedule: "0 10 * * *"
        reason: "consultation form follow-up"

  mmm-beauty-app:
    github_actions_crons: []

  beautyops:
    github_actions_crons: []
    vercel_crons: []

  dd-graph:
    github_actions_crons: []
    vercel_crons: []

  dd-packages:
    github_actions_crons:
      - workflow: starters.yml
        cron: "43 3 * * *"
        owner: "DD Framework"
        reason: "nightly starter check: makes the Next.js and Astro starters from scratch with dd new --local, builds them and runs dd doctor; red goes to Slack. GitHub-hosted (public repo), about 5 minutes per starter, 20min cap"
    vercel_crons: []

  dd-gbp:
    github_actions_crons: []
    vercel_crons: []

  dd-seo:
    github_actions_crons: []
    vercel_crons: []

  verqan-api:
