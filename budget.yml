    vercel_crons: []

  dd-repo-registry:
    github_actions_crons:
      - workflow: sweep.yml
        cron: "15 6 * * *"
        owner: "DD Framework"
        reason: "daily estate sweep: every repo the GitHub App can see, against the register; API reads only, about a minute, 10min cap. Also the estate's secret scan of each default branch's last 26 hours (DOM-776)"
      - workflow: sweep.yml
        cron: "17 3 * * 6"
        owner: "DD Framework"
        reason: "weekly secret scan of all history in every repo the GitHub App can see: the one full-history scan, replacing each repo's own (DOM-776 step 5), 60min cap"
      - workflow: repo-settings.yml
        cron: "40 6 * * *"
        owner: "DD Framework"
        reason: "daily apply of repo-settings.yaml (update-branch, auto-merge, the dd-baseline ruleset) to every repo the GitHub App can see, so new repos are covered and drift is put back and posted to ops (DOM-1037); API calls only, about two minutes, 20min cap"
      - workflow: ci-runner-valve.yml
        cron: "4,19,34,49 * * * *"
        owner: "DD Framework"
        reason: "every 15 minutes, off the hour: the runner valve (DOM-1079). Points the CI_RUNNER variables at GitHub-hosted runners while dd-ci-01 serves no jobs and back when it does, and keeps CI_RUNNER_HOSTED under the 50,000 included minutes. Pinned to ubuntu-latest (hosted-jobs.json), API calls only, under a minute (about 2,880 included minutes a month), 5min cap"
      - workflow: lighthouse-live.yml
        cron: "17 6 * * 1"
        owner: "DD Framework"
        reason: "weekly Lighthouse of every live page the registry lists under lighthouse.paths, through the PageSpeed Insights API (Google's hardware, no browser here), median of 3 runs, about ten minutes, 45min cap; replaces client-previews site-health.yml (DOM-776)"
    vercel_crons: []

  dd-relay:
    github_actions_crons:
      - workflow: ops-canary.yml
        cron: "20 5 * * *"
        owner: "Doman Digital / Ops"
        reason: "the ops Worker's github-feed canary: one step that fails on purpose daily so the cockpit proves it still sees red scheduled workflows (DOM-1029); light runner, 2min cap"
      - workflow: ops-contract.yml
        cron: "40 9 * * *"
        owner: "Doman Digital / Ops"
        reason: "nightly ops contract check: the cockpit's counts against direct Linear, GitHub, jobs.yaml and alert queries, and every feed's canary (DOM-1029); API reads and one SELECT, 10min cap"
    vercel_crons: []

  meridian:
    github_actions_crons:
      - workflow: nightly-live-modules.yml
        cron: "17 3 * * *"
        owner: "Meridian"
        reason: "nightly module integration harness against live third-party sites, moved off every pull request where it took a VM on each push and nobody acted on the result (DOM-1444, CI-017); one Rust build and test, 15min cap, non-blocking"
    vercel_crons: []

  dd-ci-standards:
    github_actions_crons:
      - workflow: renovate.yml
        cron: "17 4 * * *"
        owner: "DD Framework"
        reason: "daily self-hosted Renovate across the portfolio, so house packages (@domandigital/*) land within a day; other updates still wait for Monday (DOM-1043). Public repo, so hosted minutes are free. Unregistered until 2026-10-03: the old cron check read only the first cron line and missed it"
    vercel_crons: []

