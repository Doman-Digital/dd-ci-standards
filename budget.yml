        pr_exempt_jobs: "verify, build, linear-command-centre"
        pr_exempt_reason: "verify (30 minute cap) and build (20) are the pull request check itself, scoped to the changed paths by the changes job's plan; linear-command-centre (15) runs only for its own paths. The browser tier (phone-first, website reviews, visual regression, portal journeys) is queue-only since Doman-Digital#1777. DOM-17682"
