# Registry of every recurring CI/Vercel cost across the portfolio: GitHub
# Actions `schedule:` crons and Vercel `crons:` entries. scripts/check-workflow-
# policy.mjs fails a PR that adds a schedule or vercel.json cron not listed
# here — a cron becomes something you register with a reason, not something
# that silently starts billing.
#
# Baseline captured 2026-08-16 from the portfolio CI/Vercel audit. Add a new
# entry in the same PR that adds the cron, with a one-line reason.

repos:
  Doman-Digital:
    github_actions_crons:
      - workflow: journey-capture.yml
        cron: "15 8 * * 1"
        owner: "Doman Digital / Website QA"
        reason: "weekly journey captures on staging behind Access (playwright-journeys.yml) plus the read-only portal client run: one marked staging booking per run, cancelled in the same run; organisation runner pool, 45min cap; PageSpeed left to dd-psi (Doman-Digital#1526, then the staging journeys PR)"
      - workflow: portal-journeys.yml
        cron: "45 8 * * 1"
        owner: "Doman Digital / Portal QA"
        reason: "weekly portal journeys (handover, brief, contract, billing, six keyboard-only) on an isolated runner with service Postgres and Redis and loopback provider shims, plus the main-only Stripe test-mode sandbox job; journeys/ledger.json checked against the report; 45min cap per job, half an hour after journey-capture (Doman-Digital portal-journeys PR, 9 November 2026)"
      - workflow: site-journeys.yml
        cron: "30 8 * * 1"
        owner: "Doman Digital / Website QA"
        reason: "weekly site journeys at 375 on staging behind Access (J01 the /book calendar plus one booking on the hidden Cal.com test event by a canary attendee, cancelled in the same run; J02 contact; the /order/success receipt), axe at every step, qa/journeys/site/ledger.json checked against the report; 30min cap, a quarter of an hour after journey-capture (Doman-Digital site journeys PR, 9 November 2026)"
      - workflow: journey-capture.yml
        cron: "40 6 * * *"
        owner: "Doman Digital / Website QA"
        reason: "daily access-probe job only: one curl that checks the GitHub copy of the staging Access token still opens staging, no browser, under a minute on the light runner (dd-repo-registry creds.yaml site-staging-access-journeys)"
      - workflow: stale.yml
        cron: "30 1 * * *"
        reason: "daily stale issue/PR sweep, no checkout, near-zero cost"
      - workflow: ci.yml
        cron: "43 4 * * 1"
        reason: "weekly comprehensive full-suite sweep — deliberate, catches regressions on repos that haven't shipped in a week; paths-filter is intentionally bypassed on this trigger"
      - workflow: dd-site-live-scan.yml
        cron: "17 4 * * 2"
        reason: "weekly live scan of the served pages of www.domandigital.co.uk against the business-model facts (DOM-1512), replaces coverage-audit, 15min cap"
      - workflow: company-os.yml
        cron: "15 7 * * 1"
        owner: "Doman Digital / Company OS"
        reason: "weekly Company OS scorecard and canonical mirror refresh (DOM-377), 8min cap"
      - workflow: stripe-prices.yml
        cron: "41 6 * * *"
        owner: "Doman Digital / Marketing Site"
        reason: "daily live check that every Stripe Price the site sells matches brand-facts (DOM-1059), no install, 5min cap on the light pool"
      - workflow: dd-site-drift.yml
        cron: "7,27,47 * * * *"
        owner: "Doman Digital / Marketing Site"
        reason: "every 20 minutes: red when the live site lags main (DOM-1490); one checkout and one curl, no install, 5min cap on the light pool, off the hour"
      - workflow: dd-checks-drift.yml
        cron: "20 6 * * *"
        owner: "Doman Digital / DD Checks"
        reason: "daily drift-domains and drift-mfa (the Cyber Essentials MFA guard, DOM-1339), moved off dd-work-01 when it was deleted; one install of services/checks, a few dozen API calls, 20min cap"
      - workflow: dd-zap-baseline.yml
        cron: "41 3 * * 3"
        owner: "Doman Digital / Assurance"
        reason: "weekly OWASP ZAP baseline (passive, no attack traffic) of the public site and the portal, report kept as an artifact, a High alert fails the run (assurance item B8, 9 November 2026); one container pull, 20min cap, off the hour"
      # DOM-847 (Doman-Digital #1159): the first three days of the quarter, so a
      # dropped run is caught; the entry above goes when #1159 merges.
      - workflow: security-rotation-reminder.yml
        cron: "13 9 1-3 1,4,7,10 *"
        reason: "quarterly secret-rotation-due check on days 1-3, skips when a reminder is already open, 5min cap, off the hour"
    vercel_crons:
      - app: apps/marketing
        path: /api/cron/churn-followup
        schedule: "0 9 * * *"
        reason: "daily churn-followup dispatch"
      - app: apps/portal
        path: /api/internal/demo-followup/dispatch
        schedule: "30 9 * * *"
        reason: "daily demo-followup dispatch"
      - app: apps/portal
        path: /api/internal/google-ads/upload-conversions
        schedule: "15 2 * * *"
        reason: "nightly sweep for conversion dispatches claimed but never confirmed — without it a lead's outcome silently never reaches Google"

  dd-claude-kit:
    # repo-metadata.yml was removed on 2026-10-03; the estate sweep in
    # dd-repo-registry replaced it.
    github_actions_crons: []
    vercel_crons: []

  dd-craft-corpus:
