name: dd doctor
description: |
  Run the DD Framework rulebook (rules.json) against a checked-out repo.
  The code that runs is whatever ref `uses:` named, so the policy check, the
  local `dd doctor` and the estate sweep run the same rules at the same
  version. Fails only on rules past their enforce date; warnings are
  annotations.

inputs:
  path:
    description: Path to the checked-out repo
    default: "."
  token:
    description: Token that can read the repo's settings (kind tag, visibility, description)
    default: ${{ github.token }}
  only:
    description: Comma list of rule ids to run, and no others (the issue-ref job runs LIN-001,LIN-002)
    default: ""
  live-pr:
    description: Read the pull request through the API rather than from the event, so a re-run sees an edit (needs pull-requests read)
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "26"

    - name: dd doctor
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        DD_PATH: ${{ inputs.path }}
        DD_ONLY: ${{ inputs.only }}
        DD_LIVE_PR: ${{ inputs.live-pr }}
      run: node "$GITHUB_ACTION_PATH/../bin/dd.mjs" doctor "$DD_PATH" --format github
