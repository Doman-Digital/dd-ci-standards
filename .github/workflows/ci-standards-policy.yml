name: ci-standards policy (self)

# The gate, run against the repo that defines it, from the PR's own code.
#
# Deliberately NOT `uses: ./.github/workflows/policy.yml` or the @v1 reusable
# call every consumer makes: those run the released rules, so a PR changing a
# rule would be graded by the old version of itself and could never fail on
# its own change.
#
# This exists because two defects sat here unnoticed while the gate ran green
# in six consumer repos: the caller snippet in README.md omitted the
# concurrency block (so every repo that copied it failed forever), and the
# timeout check rejected `timeout-minutes: ${{ inputs.x }}`. A third was found
# on 2026-10-03: the cron check read only the first cron under schedule:, so
# this repo's own Renovate cron was never registered.

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  self-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # All of history without blobs, as in policy.yml: SEC-010 diffs the pull request against its
      # base and reads its commit messages, which a one-commit checkout does not have.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Test the rules (every rule has a failing and a passing example)
        run: node --test test/*.test.mjs scripts/*.test.mjs

      # The gitleaks install against the real sources (8 November 2026: a 504
      # from the release download failed every PR in the estate). The fallback
      # pins are checked live here, on every PR, so a bump that misses one is red.
      - name: gitleaks install survives a release outage, and says so when it cannot
        run: |
          set -euo pipefail
          while IFS= read -r pin; do export "${pin?}"; done < <(sed -nE 's/^ +(GITLEAKS_(VERSION|SHA256|IMAGE|IMAGE_LAYER|IMAGE_BINARY_SHA256)): "?([^"]+)"?$/\1=\3/p' gitleaks/action.yml)
          test -n "$GITLEAKS_IMAGE_BINARY_SHA256"
          dead=http://127.0.0.1:9 t="$RUNNER_TEMP/gitleaks-live"
          mkdir -p "$t"
          step() { # name, then any overrides
            local n="$1"; shift
            : > "$t/$n.out"
            env GITHUB_OUTPUT="$t/$n.out" GITHUB_PATH=/dev/null GITLEAKS_RETRIES=1 \
              GITLEAKS_CACHE_DIR="$t/${CACHE:-$n}-cache" GITLEAKS_DEST="$t/$n-bin" "$@" bash gitleaks/install.sh 2>&1 | tee "$t/$n.log"
          }
          echo "::group::releases unreachable, cache cold: the ghcr.io image"
          step image GITLEAKS_RELEASE_BASE="$dead"
          grep -qx 'source=ghcr.io image' "$t/image.out"
          "$t/image-bin/gitleaks" version | grep -q "$GITLEAKS_VERSION"
          echo "::endgroup::"
          echo "::group::cache cold, the real sources: the release, or the image while releases is down"
          step release
          grep -qxE 'source=(release|ghcr.io image)' "$t/release.out"
          "$t/release-bin/gitleaks" version | grep -q "$GITLEAKS_VERSION"
          echo "::endgroup::"
          if grep -qx 'source=release' "$t/release.out"; then
            echo "::group::both sources unreachable, cache warm: the cache"
            CACHE=release step warm GITLEAKS_RELEASE_BASE="$dead" GITLEAKS_REGISTRY="$dead"
            grep -qx 'source=cache' "$t/warm.out"
            echo "::endgroup::"
          else
            echo "::notice title=gitleaks release download down::the warm-cache case was not run live (test/gitleaks-install.test.mjs covers it)."
          fi
          echo "::group::both sources unreachable, cache cold: fails, naming the outage"
          if step cold GITLEAKS_RELEASE_BASE="$dead" GITLEAKS_REGISTRY="$dead"; then echo "installed with both sources down"; exit 1; fi
          grep -q '::error title=gitleaks download outage::' "$t/cold.log"
          test ! -e "$t/cold-bin/gitleaks"
          echo "::endgroup::"

      - id: gitleaks
        uses: ./gitleaks
      - name: The action put gitleaks on PATH
        env:
          SOURCE: ${{ steps.gitleaks.outputs.source }}
        run: echo "from the $SOURCE" && gitleaks version

      - name: dd doctor against this repo, with this PR's rules
        env:
          GH_TOKEN: ${{ github.token }}
        run: node bin/dd.mjs doctor . --format github

      # The deploy tip guard from this PR's code: a commit that is not the tip
      # of main (this PR's head) is not deployed, the tip is.
      - id: old
        uses: ./.github/actions/deploy-tip
        with:
          sha: ${{ github.event.pull_request.head.sha }}
          branch: main
      - id: tip
        uses: ./.github/actions/deploy-tip
        with:
          sha: ${{ steps.old.outputs.tip }}
          branch: main
      - name: The guard said no to the old commit and yes to the tip
        env:
          OLD: ${{ steps.old.outputs.deploy }}
          TIP: ${{ steps.tip.outputs.deploy }}
        run: test "$OLD" = false && test "$TIP" = true
