name: ci-standards policy (self)

# The gate, run against the repo that defines it, from the PR's own code.
#
# Deliberately NOT `uses: ./.github/workflows/policy.yml` or the @v1 reusable
# call every consumer makes: those run the released rules, so a PR changing a
# rule would be graded by the old version of itself and could never fail on
# its own change.
#
# This exists because two defects sat here unnoticed while the gate ran green
# in six consumer repos: the caller snippet in README.md omitted the
# concurrency block (so every repo that copied it failed forever), and the
# timeout check rejected `timeout-minutes: ${{ inputs.x }}`. A third was found
# on 2026-10-03: the cron check read only the first cron under schedule:, so
# this repo's own Renovate cron was never registered.

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  self-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Test the rules (every rule has a failing and a passing example)
        run: node --test test/*.test.mjs scripts/*.test.mjs

      - name: dd doctor against this repo, with this PR's rules
        env:
          GH_TOKEN: ${{ github.token }}
        run: node bin/dd.mjs doctor . --format github
