name: cloudflare-deploy (reusable)

# The one way a Worker is deployed from Actions (CF-001, CI-013, CI-014, SEC-007).
# deploys.json lists every Worker and the path that deploys it.
#
# What it does, in order:
#   1. Ships only the commit CI tested (the CI run's head_sha after
#      workflow_run), and only while it is still the tip of the default
#      branch. After a burst of merges every CI run finishes and calls this;
#      the older ones stop here, and the newest one deploys. A content
#      rebuild (repository_dispatch from dd-rebuild-relay) and a manual run
#      ship the tip and run the caller's manual-check first.
#   2. Installs, runs the caller's checks (pre-deploy, and on a manual run
#      the manual-check too), builds.
#   3. Fetches the Cloudflare deploy token from Doppler `dd-deploy/<config>`
#      with the repo's GitHub identity (OIDC). No Cloudflare token is stored
#      in GitHub, and Doppler only trusts that identity on the default branch.
#   4. Optionally copies runtime secrets from a Doppler config into one
#      Worker, then runs `wrangler deploy` for each config listed.
#
# Deploys of one repo queue rather than cancel each other: a deploy stopped
# halfway can leave one Worker new and the next one old.
#
# A run that the guard stops reports `cancelled`, not `success` (DOM-1422).
# The guard is a step, so GitHub would call the run a success a few seconds
# after it started, and anything that reads workflow_run events as "this
# merge is live" (dd-relay's settle()) would believe it. After the deploy job
# says `superseded`, the last job here cancels the run. Cancelling a run needs
# `actions: write`, which only the caller can grant (a called workflow cannot
# ask for more than its caller gave: GitHub refuses to start it), so the
# caller's deploy job grants it (CI-030) and this workflow's own permissions
# are the caller's. A caller that has not granted it still works: the cancel
# is refused, a warning says so, and the run ends as it did before.
#
# The CI workflow it follows must run on every push to main, with no paths:
# filter. A tip commit that CI skipped has no run to deploy it, and the guard
# stops the run for the commit before it, so nothing ships (CI-014).
#
# Call it from a workflow that runs after CI on main:
#
#   on:
#     workflow_run:
#       workflows: [CI]
#       types: [completed]
#       branches: [main]
#     workflow_dispatch:
#   permissions:
#     contents: read
#   jobs:
#     deploy:
#       permissions:
#         contents: read
#         id-token: write # signs in to Doppler
#         actions: write # cancels the run when a newer commit supersedes it (CI-030)
#       uses: Doman-Digital/dd-ci-standards/.github/workflows/cloudflare-deploy.yml@v1
#       with:
#         doppler-config: relay
#         configs: |
#           wrangler.jsonc
#           workers/email-in/wrangler.jsonc
#
# The repo needs the variable DOPPLER_IDENTITY_ID (its Doppler service
# account identity, trusting this repo's default branch) and a deploy token
# in Doppler `dd-deploy/<config>` as CLOUDFLARE_DEPLOY_VALUE: Workers Scripts
# edit only, on the one account, with an expiry. The variable
# CLOUDFLARE_ACCOUNT_ID names the account when the token can see more than
# one. See "Deploying a Worker" in the README.
#
# On a client account's runner, pass `runner: dd-client`.

on:
  workflow_call:
    inputs:
      doppler-config:
        description: The config in Doppler project `dd-deploy` that holds this repo's CLOUDFLARE_DEPLOY_VALUE.
        type: string
        required: true
      doppler-project:
        description: The Doppler project holding the deploy token.
        type: string
        default: dd-deploy
      configs:
        description: Wrangler configs to deploy, one per line, in order. Empty deploys the default config.
        type: string
        default: ""
      working-directory:
        description: Where package.json and the wrangler configs are.
        type: string
        default: "."
      node-version:
        type: string
        default: 22.x
      pre-deploy:
        description: A command run before the token is fetched, on every deploy (e.g. `node scripts/check-migrations.mjs`).
        type: string
        default: ""
      manual-check:
        description: >-
          A command run only on a manual run or a content rebuild (repository_dispatch), which have no CI run of their
          own behind them (e.g. `pnpm run typecheck && pnpm test`).
        type: string
        default: ""
      build:
        description: A build command run before deploying (e.g. `pnpm run build` for a Worker that serves static assets).
        type: string
        default: ""
      sync-secrets-to:
        description: A wrangler config whose Worker gets every secret of the Doppler config behind DOPPLER_RUNTIME_TOKEN before it deploys. Empty syncs nothing.
        type: string
        default: ""
      sync-secrets-filter:
        description: Optional repository Node script which reads Doppler JSON on stdin and emits only runtime secrets on stdout. Runs only with sync-secrets-to.
        type: string
        default: ""
      concurrency-key:
        description: >-
          Optional suffix for this call's deploy lane. Each lane deploys one at a time, and GitHub keeps only the newest
          waiting run per lane. Give a second Worker in the same repo its own key (for example "ops") so a newer deploy of
          the first Worker cannot replace its waiting job. Empty keeps the one lane per repo.
        type: string
        default: ""
      wrangler-env:
        description: >-
          The wrangler environment to deploy (`env.<name>` in the config), for a Worker whose production sits in an
          environment of a config that also holds a preview. Passed to wrangler as CLOUDFLARE_ENV, to the secret sync
          as well as the deploy. Empty deploys the top-level config.
        type: string
        default: ""
      post-deploy:
        description: >-
          A command run right after the last wrangler deploy, with the deployed commit in DEPLOY_SHA (e.g. a check that
          the live site reports it). It runs inside the deploy lane, so no other deploy of the repo can land before it
          has looked; a failure fails the run, and the deploy it follows has happened.
        type: string
        default: ""
      release-var:
        description: >-
          Optional name of a Worker variable set to the deployed commit on every deploy (`wrangler deploy --var
          NAME:<sha>`), e.g. SENTRY_RELEASE, so errors carry the release that served them. Empty sets nothing.
        type: string
        default: ""
      runner:
        description: Runner label. Defaults to the CI_RUNNER variable, then ubuntu-latest.
        type: string
        default: ""
    secrets:
      DOPPLER_RUNTIME_TOKEN:
        description: A read-only Doppler service token for the Worker's runtime secrets. Needed only with sync-secrets-to.
        required: false

# No top-level `permissions:` on purpose (SEC-008 accepts that in a reusable
# workflow whose every job states its permissions or says why it inherits):
# a top-level block would also be the default of the `superseded` job and
# stop it holding the caller's `actions: write`. Each job below states its own.
jobs:
  deploy:
    # A workflow_run deploy runs only for a CI run that passed and that a push to this repo's default branch started,
    # whatever the fork or branch that triggered CI; a manual run only from the default branch. A repository_dispatch
    # (a content rebuild sent by dd-rebuild-relay, DOM-1644) rebuilds the tip of the default branch. GitHub runs it only
    # from the default branch, the tip guard still applies, and it runs manual-check like a manual run, because the
    # tip's own CI run may not have finished. After workflow_run,
    # github.sha is the tip of the default branch when CI finished: a run for an older commit is skipped here, before
    # it waits for a VM, and the tip guard below catches a merge that lands while it waits.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch) ||
      (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) ||
      (github.event_name == 'repository_dispatch' && github.ref_name == github.event.repository.default_branch) ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_sha == github.sha)
    # dd: allow CI-002 until=2027-03-31 reusable workflow: runs on the caller's runner, defaults to GitHub-hosted, caller repos pass their own runner
    # The deploy slot (DOM-834): the org variable CI_RUNNER_DEPLOY names dd-ci-deploy, a reserved runner that
    # never waits behind pull request CI. A caller's own runner input still wins (client repos pass dd-client).
    runs-on: ${{ inputs.runner || vars.CI_RUNNER_DEPLOY || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    outputs:
      deploy: ${{ steps.tip.outputs.deploy }}
    concurrency:
      group: cloudflare-deploy-${{ github.repository }}${{ inputs.concurrency-key != '' && format('-{0}', inputs.concurrency-key) || '' }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - id: tip
        uses: Doman-Digital/dd-ci-standards/.github/actions/deploy-tip@v1
        with:
          sha: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.tip.outputs.deploy == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.tip.outputs.deploy == 'true'
        with:
          node-version: ${{ inputs.node-version }}
      - name: Install
        id: install
        if: steps.tip.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          # A package inside a pnpm workspace (apps/site) has its lockfile at the workspace root: walk up to it, no
          # further than the checkout, and install the whole workspace there. Not a filter: a package's build can read
          # other workspace packages it does not list (apps/site extends a tsconfig from @doman/config through
          # apps/marketing), and a narrower install failed the first CI deploy twice (DOM-1490).
          root="$PWD"
          while [ ! -f "$root/pnpm-lock.yaml" ] && [ "$root" != "${GITHUB_WORKSPACE:-$PWD}" ] && [ "$root" != "/" ]; do
            root="$(dirname "$root")"
          done
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
            echo "wrangler=pnpm exec wrangler" >> "$GITHUB_OUTPUT"
          elif [ ! -f package-lock.json ] && [ -f "$root/pnpm-lock.yaml" ]; then
            corepack enable
            (cd "$root" && pnpm install --frozen-lockfile)
            echo "wrangler=pnpm exec wrangler" >> "$GITHUB_OUTPUT"
          elif [ -f package-lock.json ]; then
            npm ci
            echo "wrangler=npx --no-install wrangler" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No pnpm-lock.yaml or package-lock.json in ${PWD}: wrangler must be a pinned dependency."
            exit 1
          fi
      - name: Manual run checks (no CI run behind it)
        if: >-
          steps.tip.outputs.deploy == 'true' && inputs.manual-check != '' &&
          (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch')
        env:
          CMD: ${{ inputs.manual-check }}
        run: bash -euo pipefail -c "$CMD"
      - name: Pre-deploy check
        if: steps.tip.outputs.deploy == 'true' && inputs.pre-deploy != ''
        env:
          CMD: ${{ inputs.pre-deploy }}
        run: bash -euo pipefail -c "$CMD"
      - name: Build
        if: steps.tip.outputs.deploy == 'true' && inputs.build != ''
        env:
          CMD: ${{ inputs.build }}
        run: bash -euo pipefail -c "$CMD"
      - name: Fetch the Cloudflare deploy token from Doppler
        id: doppler
        if: steps.tip.outputs.deploy == 'true'
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}
          doppler-project: ${{ inputs.doppler-project }}
          doppler-config: ${{ inputs.doppler-config }}
      - name: Install Doppler CLI
        if: steps.tip.outputs.deploy == 'true' && inputs.sync-secrets-to != ''
        uses: dopplerhq/cli-action@4819d808ab99e5cde19a0637a16536a4038fad73 # v4.0.1
      - name: Sync runtime secrets from Doppler to the Worker
        if: steps.tip.outputs.deploy == 'true' && inputs.sync-secrets-to != ''
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_RUNTIME_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ steps.doppler.outputs.CLOUDFLARE_DEPLOY_VALUE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER: ${{ steps.install.outputs.wrangler }}
          CONFIG: ${{ inputs.sync-secrets-to }}
          FILTER: ${{ inputs.sync-secrets-filter }}
          WRANGLER_ENV: ${{ inputs.wrangler-env }}
        run: |
          set -euo pipefail
          # Exported only when set: wrangler would read an empty CLOUDFLARE_ENV as an environment named "".
          if [ -n "${WRANGLER_ENV:-}" ]; then export CLOUDFLARE_ENV="$WRANGLER_ENV"; fi
          if [ -z "$DOPPLER_TOKEN" ]; then
            echo "::error::sync-secrets-to is set but DOPPLER_RUNTIME_TOKEN was not passed."
            exit 1
          fi
          if [ -n "$FILTER" ]; then
            doppler secrets download --no-file --format json | node "$FILTER" | $WRANGLER secret bulk --config "$CONFIG"
          else
            doppler secrets download --no-file --format json | $WRANGLER secret bulk --config "$CONFIG"
          fi
      - name: Deploy
        if: steps.tip.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.doppler.outputs.CLOUDFLARE_DEPLOY_VALUE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER: ${{ steps.install.outputs.wrangler }}
          CONFIGS: ${{ inputs.configs }}
          FROM: ${{ inputs.doppler-project }}/${{ inputs.doppler-config }}
          WRANGLER_ENV: ${{ inputs.wrangler-env }}
          RELEASE_VAR: ${{ inputs.release-var }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${WRANGLER_ENV:-}" ]; then export CLOUDFLARE_ENV="$WRANGLER_ENV"; fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Doppler ${FROM} has no CLOUDFLARE_DEPLOY_VALUE."
            exit 1
          fi
          extra=()
          if [ -n "${RELEASE_VAR:-}" ]; then extra=(--var "${RELEASE_VAR}:${DEPLOY_SHA}"); fi
          if [ -z "${CONFIGS//[[:space:]]/}" ]; then
            $WRANGLER deploy "${extra[@]}"
          else
            while IFS= read -r c; do
              c="${c#"${c%%[![:space:]]*}"}"; c="${c%"${c##*[![:space:]]}"}"
              [ -n "$c" ] || continue
              echo "::group::wrangler deploy --config $c"
              $WRANGLER deploy --config "$c" "${extra[@]}"
              echo "::endgroup::"
            done <<< "$CONFIGS"
          fi
      - name: Post-deploy check
        if: steps.tip.outputs.deploy == 'true' && inputs.post-deploy != ''
        env:
          CMD: ${{ inputs.post-deploy }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: bash -euo pipefail -c "$CMD"

  # The deploy job's tip guard stopped it: a newer commit is the tip and its own
  # run deploys it. Cancel this run so it reports cancelled, not success (DOM-1422).
  superseded:
    needs: deploy
    if: needs.deploy.outputs.deploy == 'false'
    # dd: allow CI-002 until=2027-03-31 reusable workflow: runs on the caller's runner, defaults to GitHub-hosted, caller repos pass their own runner
    runs-on: ${{ inputs.runner || vars.CI_RUNNER_DEPLOY || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 3
    # dd: inherit-permissions the caller's actions: write is all this job needs, and it checks out nothing and holds no secret
    steps:
      - uses: Doman-Digital/dd-ci-standards/.github/actions/cancel-superseded@v1
