name: Renovate (self-hosted)

# Runs Renovate directly via GitHub Actions instead of depending on Mend's
# hosted service. Built 2026-08-17 after the hosted onboarding flow at
# developer.mend.io returned a 403 on "Failed to onboard organizations" for
# at least one account (redacted) and every repo across the portfolio
# showed zero Renovate activity days after install — a CLI dry-run against
# Doman-Digital (see the ci-standards README) had already proven the
# renovate.json config itself resolves correctly, so the fault was Mend's
# onboarding backend, not this config. This workflow sidesteps it entirely.
#
# Lives here (Doman-Digital org) rather than on a personal account on
# purpose: dmitridoman's personal GitHub Actions billing was blocked as of
# 2026-08-17. The org account showed no such block.
#
# One job per GitHub owner, each minting its own short-lived App
# installation token (mirrors the same actions/create-github-app-token
# pattern already used in every repo's own ci.yml for the private dd-graph
# dependency), running Renovate against an explicit repo list rather than
# --autodiscover. Autodiscover was tried first and it scanned every repo the
# App's installation could see under each owner, including repos that were
# never part of this rollout and were never onboarded (e.g. Doman-Digital's
# own dd-library, StarrLuxury) -- those failed at initRepo, harmlessly under
# --dry-run, but it's the wrong blast radius for a real run. List only the
# repos that actually carry a renovate.json from this rollout.

on:
  schedule:
    # Inside the "before 6am on monday" window set in default.json.
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Dry run (no PRs opened)"
        required: true
        default: true
        type: boolean

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - owner: dmitridoman
            repos: "dmitridoman/Doman-Digital dmitridoman/redacted-api"
          - owner: Doman-Digital
            repos: "Doman-Digital/dd-graph Doman-Digital/dd-gbp Doman-Digital/dd-seo"
          - owner: redacted
            repos: "redacted/redacted"
          - owner: redacted
            repos: "redacted/redacted"
          - owner: redacted
            repos: "redacted/redacted"
          - owner: redacted
            repos: "redacted/redacted"
          - owner: redacted
            repos: "redacted/redacted"
          - owner: redacted
            repos: "redacted/redacted"
    steps:
      - name: Mint token for ${{ matrix.owner }}
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CI_GH_APP_ID }}
          private-key: ${{ secrets.CI_GH_APP_PRIVATE_KEY }}
          owner: ${{ matrix.owner }}

      # Every target repo here is pnpm-managed, and Renovate shells out to the
      # package manager (e.g. `pnpm install --lockfile-only`) when it needs to
      # regenerate a lockfile for a vulnerability-remediation branch --
      # osvVulnerabilityAlerts in default.json makes those immediate rather
      # than deferred, so this isn't a rare path. The runner has no pnpm by
      # default; the first real run hit `spawn pnpm ENOENT` on every such
      # branch, logged it as a non-fatal unhandledRejection, and then spent
      # the rest of its 30-minute budget retrying before finally exiting --
      # so this shows up as a near-total hang, not a fast, obvious failure.
      # `corepack enable` (not a hardcoded pnpm/action-setup version) because
      # Renovate clones each target repo into its own temp dir and Corepack
      # resolves the pnpm version from *that* directory's own package.json
      # packageManager field -- exactly what's needed across repos pinned to
      # different pnpm majors (9.x here, 10.x there).
      - name: Enable Corepack (pnpm via each repo's own packageManager field)
        run: corepack enable

      - name: Run Renovate
        env:
          RENOVATE_TOKEN: ${{ steps.app-token.outputs.token }}
          RENOVATE_PLATFORM: github
          RENOVATE_DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dryRun) && 'full' || 'null' }}
          LOG_LEVEL: debug
        run: npx --yes renovate ${{ matrix.repos }}
