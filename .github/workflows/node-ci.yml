name: node-ci (reusable)

# Reference reusable CI for a single-app pnpm/Node repo. NOT yet adopted by
# any repo in the portfolio as of 2026-08-16 — each repo's existing ci.yml
# reflects real, previously-tested logic (GitHub App token minting for
# private deps, Playwright caching, monorepo path filters) that a first-pass
# generic workflow shouldn't blindly replace while GitHub Actions billing is
# blocked and no run can verify the swap. Migrate one repo at a time once
# billing clears and each migration can be confirmed by an actual green run.
#
# Adoption, once ready:
#
#   jobs:
#     ci:
#       uses: Doman-Digital/dd-ci-standards/.github/workflows/node-ci.yml@v1
#       with:
#         node_version: "22"
#       secrets: inherit
#
# Pin the @v1 tag and let Renovate keep it current — that's what stops every
# repo re-drifting onto a different actions/checkout generation.

on:
  workflow_call:
    inputs:
      node_version:
        type: string
        default: "22"
      pnpm_version:
        type: string
        default: "9"
      run_lint:
        type: boolean
        default: true
      lint_command:
        type: string
        default: "pnpm run lint"
      run_typecheck:
        type: boolean
        default: true
      typecheck_command:
        type: string
        default: "pnpm run typecheck"
      run_test:
        type: boolean
        default: true
      test_command:
        type: string
        default: "pnpm run test"
      run_build:
        type: boolean
        default: true
      build_command:
        type: string
        default: "pnpm run build"
      # Set when a private git+https dependency needs a short-lived GitHub
      # App token minted before `pnpm install` (mirrors the pattern already
      # used by RMP-Electrical, Rise-and-bloom, Doman-Digital for dd-graph).
      private_dep_owner:
        type: string
        default: ""
      private_dep_repo:
        type: string
        default: ""
      timeout_minutes:
        type: number
        default: 10
    secrets:
      PRIVATE_DEP_APP_ID:
        required: false
      PRIVATE_DEP_APP_PRIVATE_KEY:
        required: false

# The job only reads the repo; the private-dependency clone uses its own
# App token below.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ inputs.pnpm_version }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node_version }}
          cache: "pnpm"

      - name: Mint GitHub App token for private dependency
        if: inputs.private_dep_owner != '' && inputs.private_dep_repo != ''
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.PRIVATE_DEP_APP_ID }}
          private-key: ${{ secrets.PRIVATE_DEP_APP_PRIVATE_KEY }}
          owner: ${{ inputs.private_dep_owner }}
          repositories: ${{ inputs.private_dep_repo }}
          permission-contents: read

      - name: Authenticate git for private dependency
        if: inputs.private_dep_owner != '' && inputs.private_dep_repo != ''
        # Inputs reach the script as env vars, never as ${{ }} expanded into
        # it: an expanded value is spliced into the shell source before bash
        # parses it, so a quote in an input would run as code (zizmor
        # template-injection).
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          DEP_OWNER: ${{ inputs.private_dep_owner }}
          DEP_REPO: ${{ inputs.private_dep_repo }}
        run: |
          git config --global \
            url."https://x-access-token:${APP_TOKEN}@github.com/${DEP_OWNER}/${DEP_REPO}".insteadOf \
            "https://github.com/${DEP_OWNER}/${DEP_REPO}"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: inputs.run_lint
        env:
          COMMAND: ${{ inputs.lint_command }}
        run: bash -c "$COMMAND"

      - name: Typecheck
        if: inputs.run_typecheck
        env:
          COMMAND: ${{ inputs.typecheck_command }}
        run: bash -c "$COMMAND"

      - name: Test
        if: inputs.run_test
        env:
          COMMAND: ${{ inputs.test_command }}
        run: bash -c "$COMMAND"

      - name: Build
        if: inputs.run_build
        env:
          COMMAND: ${{ inputs.build_command }}
        run: bash -c "$COMMAND"
