name: ci-standards policy

# Reusable workflow — call it from any repo's own CI. Copy the whole
# snippet, concurrency block included: the caller runs on pull_request, so
# without it the gate reports CI-004 against its own file.
#
#   name: ci-standards policy
#
#   on:
#     pull_request:
#
#   concurrency:
#     group: ${{ github.workflow }}-${{ github.ref }}
#     cancel-in-progress: true
#
#   permissions:
#     contents: read
#
#   jobs:
#     ci-standards-policy:
#       uses: Doman-Digital/dd-ci-standards/.github/workflows/policy.yml@v1
#
# That is the whole caller, the same in every repo (`dd adopt` writes it).
# Nothing about a repo is configured here: what differs between repos lives
# in this repo's registers, read at the same release.
#
# On every pull request it runs `dd doctor` (bin/dd.mjs, rules in rules.json)
# against the calling repo, then gitleaks over the commits the pull request
# adds (SEC-006), then Semgrep over the files it changes if scanners.json
# lists the repo for it. A rule past its enforce date fails the PR; a newer
# rule only warns until its date. `@v1` moves with every release
# (release.yml), so a new rule reaches every caller at once, as a warning
# first. The doctor runs from the same release (doctor@v1): until 13 October
# 2026 it was pinned to v1.0.13, so every caller ran 5 October's rules while
# v1 moved on (FW-003).
#
# This is the estate's only pull request scanner. What reaches a default
# branch without a pull request, and all of history once a week, is scanned
# centrally by the estate sweep in Doman-Digital/dd-repo-registry, over every
# repo it sees. A repo that runs a scanner of its own fails CI-015
# (DOM-776, 20 October 2026: the monorepo, redacted, redacted-app,
# redacted and redacted each did, a VM and a clone apiece).
#
# gitleaks reads the calling repo's .gitleaks.toml and .gitleaksignore if
# there are any. The binary is fetched at a fixed version and checked against
# its published sha256.
#
# The checkout is all of history without file contents (a blobless clone):
# commits and trees come down at once, and git fetches the blobs of the
# scanned commits when gitleaks reads them. In the monorepo the full-history
# clone took 110 to 140 of the job's 150 seconds; blobless it is about 12
# (DOM-776, 19 October 2026).
#
# One job, not two (13 October 2026, DOM-776): every job is a fresh VM on a
# host that runs six at once for the whole estate, and this gate runs on every
# pull request in every repo, so a second job for a 20-second scan cost a VM
# boot and a checkout per PR. The `secrets` job stays as a skipped job, which
# takes no runner and still satisfies rulesets that require
# `<caller> / secrets`; drop it once no ruleset names it. Semgrep is a step in
# the same job for the same reason.
#
# GitHub-hosted by default: callers include public repos. A private repo
# passes its own runner. Org repos pass the org's variable (CI_RUNNER); client
# repos pass their scale set, so the gate does not spend the client's own
# Free-plan minutes:
#
#       uses: Doman-Digital/dd-ci-standards/.github/workflows/policy.yml@v1
#       with:
#         runner: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}   # or dd-client
#
# Never pass a self-hosted runner from a public repo: a fork's pull request
# would run on it.

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label for the job. Leave unset in public repos.
        type: string
        default: ubuntu-latest

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 8
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      # semgrep/semgrep, the image redacted's own workflow pulled on 19 October 2026.
      SEMGREP_IMAGE: semgrep/semgrep@sha256:529ee8a277ec8adc5b534d7c74eea0a47e9de21d62852b6ba7ac6ba9566845c3
    steps:
      - name: Checkout calling repo, full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
          path: repo

      # Which scanners beyond gitleaks this repo runs, from scanners.json at
      # this release. Before the doctor, which fails the job on a broken rule.
      - id: scanners
        uses: Doman-Digital/dd-ci-standards/scanners@v1

      - uses: Doman-Digital/dd-ci-standards/doctor@v1
        with:
          path: repo

      - name: Install gitleaks
        if: ${{ !cancelled() }}
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks" && tar -xzf gitleaks.tgz -C "$RUNNER_TEMP/gitleaks" gitleaks && rm gitleaks.tgz
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Scan the commits this pull request adds
        if: ${{ !cancelled() }}
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            range="${BASE_SHA}..${HEAD_SHA}"
          else
            range="HEAD~1..HEAD"
          fi
          # Lazy history blobs still need private-repo auth after checkout
          # removes its credentials. Scope it to this step's Git children;
          # never persist it or put a token in a process argument.
          set +x
          unset GIT_TRACE GIT_TRACE_CURL GIT_TRACE_PACKET GIT_CURL_VERBOSE
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL%/}/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          gitleaks git --log-opts="$range" --redact --no-banner .

      # Was redacted's security-semgrep.yml, its own VM and container on
      # every pull request (DOM-776). p/secrets is left out: gitleaks above
      # already scans the same commits for secrets.
      - name: Semgrep (the files this pull request changes)
        if: ${{ !cancelled() && steps.scanners.outputs.semgrep == 'true' && github.event_name == 'pull_request' }}
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set +x
          unset GIT_TRACE GIT_TRACE_CURL GIT_TRACE_PACKET GIT_CURL_VERBOSE
          # The container runs as root over a checkout the runner user owns,
          # and fetches baseline blobs with the same scoped header as above.
          export GIT_CONFIG_COUNT=2
          export GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL%/}/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          export GIT_CONFIG_KEY_1=safe.directory
          export GIT_CONFIG_VALUE_1='*'
          docker run --rm -v "$PWD:/src" -w /src \
            -e GIT_CONFIG_COUNT -e GIT_CONFIG_KEY_0 -e GIT_CONFIG_VALUE_0 -e GIT_CONFIG_KEY_1 -e GIT_CONFIG_VALUE_1 \
            "$SEMGREP_IMAGE" \
            semgrep scan --config p/default --baseline-commit "$BASE_SHA" --error --metrics=off --disable-version-check

  # Kept for rulesets that require `<caller> / secrets`: a skipped job takes no
  # runner and counts as passed. The scan runs in `check` above.
  secrets:
    if: ${{ false }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 1
    steps:
      - run: echo "The secret scan runs in the check job."
