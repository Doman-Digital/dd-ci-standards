name: ci-standards policy

# Reusable workflow — call it from any repo's own CI. Copy the whole
# snippet, concurrency block included: the caller runs on pull_request, so
# without it the gate reports CI-004 against its own file.
#
#   name: ci-standards policy
#
#   on:
#     pull_request:
#
#   concurrency:
#     group: ${{ github.workflow }}-${{ github.ref }}
#     cancel-in-progress: true
#
#   jobs:
#     ci-standards-policy:
#       uses: Doman-Digital/dd-ci-standards/.github/workflows/policy.yml@v1
#
# Runs `dd doctor` (bin/dd.mjs, rules in rules.json) against the calling
# repo. A rule past its enforce date fails the PR; a newer rule only warns
# until its date. `@v1` moves with every release (release.yml), so a new rule
# reaches every caller at once, as a warning first.
#
# The secrets job runs gitleaks over the commits the pull request adds (SEC-006).
# It reads the calling repo's .gitleaks.toml if there is one. The binary is
# fetched at a fixed version and checked against its published sha256.
#
# GitHub-hosted on purpose: callers include public repos and client repos in
# other accounts, which cannot use the organisation's self-hosted runners.

on:
  workflow_call: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout calling repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: repo

      - uses: Doman-Digital/dd-ci-standards/doctor@v1.0.13
        with:
          path: repo

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout calling repo, full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks" && tar -xzf gitleaks.tgz -C "$RUNNER_TEMP/gitleaks" gitleaks && rm gitleaks.tgz
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Scan the commits this pull request adds
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            range="${BASE_SHA}..${HEAD_SHA}"
          else
            range="HEAD~1..HEAD"
          fi
          gitleaks git --log-opts="$range" --redact --no-banner .
