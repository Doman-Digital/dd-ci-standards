name: ci-standards policy

# Reusable workflow — call it from any repo's own CI. Copy the whole
# snippet, concurrency block included: the caller runs on pull_request, so
# without it the gate reports CI-004 against its own file.
#
#   name: ci-standards policy
#
#   on:
#     pull_request:
#     # Optional: scan what reaches main without a pull request, and all of
#     # history once a week. Register the cron in budget.yml (CI-007).
#     push:
#       branches: [main]
#     schedule:
#       - cron: "17 3 * * 6"
#
#   concurrency:
#     group: ${{ github.workflow }}-${{ github.ref }}
#     cancel-in-progress: ${{ github.event_name == 'pull_request' }}
#
#   permissions:
#     contents: read
#
#   jobs:
#     ci-standards-policy:
#       uses: Doman-Digital/dd-ci-standards/.github/workflows/policy.yml@v1
#
# What it does depends on what started it:
#
# - pull_request: `dd doctor` (bin/dd.mjs, rules in rules.json) against the
#   calling repo, then gitleaks over the commits the pull request adds
#   (SEC-006), then Semgrep over the files it changes if the caller asks for it.
# - push (to main): gitleaks over the pushed commits. This is the backstop for
#   anything that reached main without a pull request. It replaced the
#   separate TruffleHog and gitleaks workflows in MMM-Beauty, mmm-beauty-app
#   and beautyops (DOM-776, 20 October 2026).
# - schedule or workflow_dispatch: gitleaks over all of the checked-out
#   branch's history (the weekly full scan, which was the monorepo's own
#   secret-scan.yml), and a Slack message if it finds anything.
#
# A rule past its enforce date fails the PR; a newer rule only warns until its
# date. `@v1` moves with every release (release.yml), so a new rule reaches
# every caller at once, as a warning first. The doctor runs from the same
# release (doctor@v1): until 13 October 2026 it was pinned to v1.0.13, so every
# caller ran 5 October's rules while v1 moved on (FW-003).
#
# gitleaks reads the calling repo's .gitleaks.toml and .gitleaksignore if
# there are any. The binary is fetched at a fixed version and checked against
# its published sha256.
#
# The checkout is all of history without file contents (a blobless clone):
# commits and trees come down at once, and git fetches the blobs of the
# scanned commits when gitleaks reads them. In the monorepo the full-history
# clone took 110 to 140 of the job's 150 seconds; blobless it is about 12
# (DOM-776, 19 October 2026). The weekly full scan reads every blob, so it
# takes the plain full clone instead.
#
# One job, not two (13 October 2026, DOM-776): every job is a fresh VM on a
# host that runs six at once for the whole estate, and this gate runs on every
# pull request in every repo, so a second job for a 20-second scan cost a VM
# boot and a checkout per PR. The `secrets` job stays as a skipped job, which
# takes no runner and still satisfies rulesets that require
# `<caller> / secrets`; drop it once no ruleset names it. Semgrep is a step in
# the same job for the same reason.
#
# GitHub-hosted by default: callers include public repos. A private repo
# passes its own runner. Org repos pass the org's variable (CI_RUNNER); client
# repos pass their scale set, so the gate does not spend the client's own
# Free-plan minutes:
#
#       uses: Doman-Digital/dd-ci-standards/.github/workflows/policy.yml@v1
#       with:
#         runner: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}   # or dd-client
#         semgrep: true            # optional: Semgrep p/default on the diff
#       secrets:
#         SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}   # optional
#
# Never pass a self-hosted runner from a public repo: a fork's pull request
# would run on it.

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label for the job. Leave unset in public repos.
        type: string
        default: ubuntu-latest
      semgrep:
        description: Run Semgrep's p/default rules over the files a pull request changes.
        type: boolean
        default: false
    secrets:
      SLACK_WEBHOOK_URL:
        description: Where a failed scheduled scan is reported. Without it the run is only red.
        required: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ inputs.runner }}
    # 8 for a pull request or a push. 45 for a scan of all of history: the
    # monorepo's took 53s to 10m32s on the VM for about 1,650 commits.
    timeout-minutes: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 45 || 8 }}
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      # semgrep/semgrep, the image sen-sphere's own workflow pulled on 19 October 2026.
      SEMGREP_IMAGE: semgrep/semgrep@sha256:529ee8a277ec8adc5b534d7c74eea0a47e9de21d62852b6ba7ac6ba9566845c3
    steps:
      - name: Checkout calling repo, full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 'blob:none' || '' }}
          path: repo

      - if: github.event_name == 'pull_request'
        uses: Doman-Digital/dd-ci-standards/doctor@v1
        with:
          path: repo

      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks" && tar -xzf gitleaks.tgz -C "$RUNNER_TEMP/gitleaks" gitleaks && rm gitleaks.tgz
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Scan for secrets
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          # Lazy history blobs still need private-repo auth after checkout
          # removes its credentials. Scope it to this step's Git children;
          # never persist it or put a token in a process argument.
          set +x
          unset GIT_TRACE GIT_TRACE_CURL GIT_TRACE_PACKET GIT_CURL_VERBOSE
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL%/}/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          case "$EVENT_NAME" in
            pull_request)
              if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
                range="${BASE_SHA}..${HEAD_SHA}"
              else
                range="HEAD~1..HEAD"
              fi
              echo "Scanning the commits this pull request adds: $range" ;;
            push)
              # A new branch has no before; a force push may leave before
              # unreachable. Either way, scan the commit that was pushed.
              if [ -n "$BEFORE_SHA" ] && ! printf '%s' "$BEFORE_SHA" | grep -q '^0*$' \
                && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
                range="${BEFORE_SHA}..${AFTER_SHA}"
              else
                range="-1 ${AFTER_SHA:-HEAD}"
              fi
              echo "Scanning the pushed commits: $range" ;;
            *)
              # Only what the checked-out branch reaches. Without log options
              # gitleaks reads `git log --all`, every branch on the remote.
              range="HEAD"
              echo "Scanning all of $(git rev-parse --abbrev-ref HEAD)'s history" ;;
          esac
          gitleaks git --log-opts="$range" --redact --no-banner .

      # Was sen-sphere's security-semgrep.yml, its own VM and container on
      # every pull request (DOM-776). p/secrets is left out: gitleaks above
      # already scans the same commits for secrets.
      - name: Semgrep (the files this pull request changes)
        if: ${{ !cancelled() && inputs.semgrep && github.event_name == 'pull_request' }}
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set +x
          unset GIT_TRACE GIT_TRACE_CURL GIT_TRACE_PACKET GIT_CURL_VERBOSE
          # The container runs as root over a checkout the runner user owns,
          # and fetches baseline blobs with the same scoped header as above.
          export GIT_CONFIG_COUNT=2
          export GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL%/}/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          export GIT_CONFIG_KEY_1=safe.directory
          export GIT_CONFIG_VALUE_1='*'
          docker run --rm -v "$PWD:/src" -w /src \
            -e GIT_CONFIG_COUNT -e GIT_CONFIG_KEY_0 -e GIT_CONFIG_VALUE_0 -e GIT_CONFIG_KEY_1 -e GIT_CONFIG_VALUE_1 \
            "$SEMGREP_IMAGE" \
            semgrep scan --config p/default --baseline-commit "$BASE_SHA" --error --metrics=off --disable-version-check

      # Nothing else watches a scheduled run: it is not a PR check, so a
      # finding has to reach a person.
      - name: Post a failed scheduled scan to Slack
        if: ${{ failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL is not passed, so only this run shows the failure."
            exit 0
          fi
          printf '{"text":"Secret scan of all history failed in %s: %s"}' "$REPO" "$RUN_URL" \
            | curl -sf -X POST "$SLACK_WEBHOOK_URL" -H 'Content-Type: application/json' -d @-

  # Kept for rulesets that require `<caller> / secrets`: a skipped job takes no
  # runner and counts as passed. The scan runs in `check` above.
  secrets:
    if: ${{ false }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 1
    steps:
      - run: echo "The secret scan runs in the check job."
