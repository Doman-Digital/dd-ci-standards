name: ci-standards policy

# Reusable workflow — call it from any repo's own CI. Copy the whole
# snippet, concurrency block included: the caller runs on pull_request, so
# without it the gate reports [missing-concurrency] against its own file.
#
#   name: ci-standards policy
#
#   on:
#     pull_request:
#
#   concurrency:
#     group: ${{ github.workflow }}-${{ github.ref }}
#     cancel-in-progress: true
#
#   jobs:
#     ci-standards-policy:
#       uses: Doman-Digital/dd-ci-standards/.github/workflows/policy.yml@v1
#
# Fails the calling PR if it reintroduces the waste patterns found in the
# 2026-08-16 portfolio CI audit: push+pull_request double-runs, jobs with
# no timeout-minutes, PR-triggered workflows with no concurrency
# cancellation, unregistered cron schedules (GitHub Actions or Vercel), and
# unexplained continue-on-error. See scripts/check-workflow-policy.mjs for
# what each check actually does. Also fails when the repo's GitHub
# description or tags break repo-topics.json (scripts/check-repo-metadata.mjs).

on:
  workflow_call: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout calling repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: repo

      - name: Checkout ci-standards
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: Doman-Digital/dd-ci-standards
          ref: v1
          path: ci-standards

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Run policy check
        run: node ci-standards/scripts/check-workflow-policy.mjs repo ci-standards/budget.yml

      - name: Check the repo's description and tags
        # Reads the calling repo's live GitHub settings, so a repo with no
        # description or no kind/status tag fails on its next PR. Rules:
        # repo-topics.json. The same file drives claude-kit's daily audit of
        # every repo, which also catches the ones nobody opens a PR on.
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ci-standards/scripts/check-repo-metadata.mjs ci-standards/repo-topics.json
