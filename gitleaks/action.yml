name: dd gitleaks
description: |
  Install the pinned gitleaks for the policy check and put it on PATH. The
  release tarball is cached per version and sha256, downloaded with retries
  when the cache is cold, and fetched from the gitleaks image on ghcr.io when
  GitHub releases is down. Every path is checked against a pinned sha256
  (install.sh). Both sources down fails with an error naming the outage.

outputs:
  source:
    description: Where the binary came from, cache, release or ghcr.io image.
    value: ${{ steps.install.outputs.source }}

runs:
  using: composite
  steps:
    # The tarball, not the binary, so a cache hit is checked against the same
    # GITLEAKS_SHA256 as a download. A cache is the calling repo's, readable by
    # later runs of the same pull request (and by every pull request, once the
    # default branch has one).
    - id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/gitleaks-cache
        key: gitleaks-8.30.1-linux-x64-551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

    - id: install
      shell: bash
      env:
        # Bump all four together: the layer and binary pins are the
        # linux/amd64 image of the same version, ghcr.io/gitleaks/gitleaks:v<version>.
        # test/gitleaks-install.test.mjs fails when the cache key or the image
        # tag here names another version.
        GITLEAKS_VERSION: "8.30.1"
        GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1
        GITLEAKS_IMAGE_LAYER: sha256:61fdfd7c017596d0815635bb8ae7dff0221723c481f12f265c9a9c91a3fe03ad
        GITLEAKS_IMAGE_BINARY_SHA256: 09d435057df51b800201bc3bbe0820554b1cac3cd98162e9e02b20c8b441b5bd
        GITLEAKS_CACHE_DIR: ${{ runner.temp }}/gitleaks-cache
        GITLEAKS_DEST: ${{ runner.temp }}/gitleaks
      run: bash "$GITHUB_ACTION_PATH/install.sh"

    # Saved straight after a download that passed its checksum, not at the end
    # of the job, so a scan that finds a secret still warms the cache.
    - if: ${{ steps.restore.outputs.cache-hit != 'true' && steps.install.outputs.source == 'release' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/gitleaks-cache
        key: ${{ steps.restore.outputs.cache-primary-key }}
